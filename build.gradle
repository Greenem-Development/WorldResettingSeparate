apply plugin: 'java'
apply plugin: 'eclipse'
eclipse {
    project {
        name = 'WorldResettingSeparate'
    }
}

group 'org.greenem.plugins.separateworldresetting'
version '1.0.0'

repositories {
    mavenCentral()
    maven {
    	url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' 
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.18.2-R0.1-SNAPSHOT'
}

sourceSets {
    main {
        java {
            srcDirs 'src'
        }
        resources {
            srcDir 'resources' 
        }
    }
}

jar {
	archiveBaseName = 'WorldResettingSeparate'
    destinationDirectory.set(file("C:/Users/andpo/Desktop/Vanya/1.18.2/plugins"))
    //destinationDirectory.set(file("C:/Shared"))
    configurations.implementation.canBeResolved=true
    from { configurations.implementation.collect {
      //it.canBeResolved = true 
      it.isDirectory() ? it : zipTree(it) } 
    }
    //with jar
}