name: WorldResetting
main: org.greenem.plugins.separateworldresetting.main.Main
version: 1.0.0
api-version: 1.13
commands:
   resetworld:
      description: DELETES THE WORLD AND RESTARTS THE SERVER
      permission: worldresettingseparate.resetworld

permissions:
   worldresettingseparate.resetworld:
      description: Allow resetting the entire world
      default: op